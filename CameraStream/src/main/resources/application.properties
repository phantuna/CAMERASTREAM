spring.application.name=CameraStream
server.port=8080

# PostgreSQL Database (Docker)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:camerastream_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=true

# Spring Data Page Serialization (Fixes PageImpl serialization warning in Spring Boot 3.3+)
spring.data.web.pageable.page-serialization-mode=via-dto

# HikariCP Connection Pool Optimization
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000


# MediaMTX Configuration
mediamtx.api-url=${MEDIAMTX_API_URL:http://localhost:9997}
mediamtx.webrtc-base-url=${MEDIAMTX_WEBRTC_URL:http://localhost:8889}
mediamtx.rtsp-base-url=${MEDIAMTX_RTSP_URL:rtsp://localhost:8554}

# File upload / snapshot limits
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# =====================================================
# BACKUP & STORAGE CONFIGURATION (HPTICKET ARCHITECTURE)
# =====================================================
backup.storage.path=${BACKUP_STORAGE_PATH:D:/HOANGPHAT-PROJECT/CAMERA_WEB_STREAM/data/backup}
backup.max-concurrent=1
backup.retention.max-backups=${BACKUP_MAX_RETAIN:10}
backup.retention.days=${BACKUP_RETENTION_DAYS:7}
backup.postgres.container-name=${BACKUP_POSTGRES_CONTAINER_NAME:camerastream-postgres}
backup.postgres.db-name=${DB_NAME:camerastream_db}
backup.postgres.username=${DB_USER:postgres}
backup.postgres.password=${DB_PASSWORD:postgres}
backup.stream.idle-timeout-seconds=300
backup.stream.lock-wait-timeout-ms=30000
backup.schedule.cron=0 0 2 * * *
backup.schedule.enabled=true

# =====================================================
# ẢNH SNAPSHOT (ALPR)
# =====================================================
# Thư mục lưu ảnh — PHẢI trỏ cùng một thư mục với biến môi trường
# SNAPSHOT_STORAGE_PATH của AI service. Khi tách 2 service ra 2 máy,
# đây phải là shared volume.
snapshot.storage.path=${SNAPSHOT_STORAGE_PATH:D:/HOANGPHAT-PROJECT/CAMERA_WEB_STREAM/data/snapshots}
# URL công bố tới frontend. Trong production phải là domain public thật,
# không phải localhost — nếu không FE ở máy khác sẽ không tải được ảnh.
snapshot.base-url=${SNAPSHOT_BASE_URL:http://localhost:8080/snapshots}
# Số ngày giữ ảnh trước khi job dọn dẹp xóa đi.
snapshot.retention-days=${SNAPSHOT_RETENTION_DAYS:30}


