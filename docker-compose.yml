services:
  postgres:
    image: postgres:15-alpine
    container_name: camerastream-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: camerastream_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: camerastream-mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554"       # RTSP Stream
      - "8889:8889"       # WebRTC WHEP (Truyền hình ảnh lên Web độ trễ < 0.2s)
      - "8189:8189/udp"   # WebRTC ICE UDP (Bắt buộc để truyền dữ liệu video lên trình duyệt)
      - "9997:9997"       # REST API quản lý luồng
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro

  ai-service:
    image: camerastream-ai:latest
    build:
      context: ./ai_service
      dockerfile: Dockerfile
      args:
        USE_GPU: 0  # Đổi thành 1 khi build bản hỗ trợ card NVIDIA GPU (onnxruntime-gpu)
    container_name: camerastream-ai
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - BACKEND_URL=http://backend:8080
      - MEDIAMTX_RTSP_URL=rtsp://mediamtx:8554
      - MEDIAMTX_API_URL=http://mediamtx:9997
      - WEB_PORT=5000
      # Tần số phân tích: 0.060s (~16 FPS) mượt mà, Burst 0.040s (25 FPS) khi có xe lao qua cổng
      - AI_INFERENCE_INTERVAL=0.060
      # Xử lý tức thì từng frame khi có xe vào: 0ms trễ, bám đồng thời nhiều xe
      - AI_FRAME_SKIP=1
      - AI_TRACKER=bytetrack
      # Chống tranh chấp luồng CPU (Thread Thrashing) giữa Detector và OCR Worker Pool:
      - AI_CPU_THREADS=2
      # Tối ưu Tầng 1: object_det.onnx kết hợp bám thân xe liên tục (SdkInfer)
      - AI_TIER1_ON_DEMAND=1
      - AI_OCR_MAX_TOTAL=4
      - AI_OCR_WORKERS=3
      - AI_NEAR_PX=80
      # Khôi phục chuẩn gốc images.tar: ngưỡng 0.20 bắt biển số tức thì từ xa & xe phóng nhanh
      - AI_DETECTOR_CONF=0.20
      - AI_MIN_OCR_CONF=40
      - AI_MIN_PLATE_WIDTH=14
      - AI_FRAME_MAX_WIDTH=960
      - AI_OCR_PER_FRAME=3
      - AI_MAX_TRACKS=12
      - AI_OUTDOOR_MODE=1
      # Bật vẽ khung xe trong ROI (bắt xe máy đi ngược chiều không biển trước & xe vừa tiến vào ROI)
      - AI_SHOW_UNPLATED_VEHICLES=1
      # Bật bộ đệm đón đầu từ xa ngoài ROI (ADR 0003: AI bám xe sớm để giải mã xe tốc độ cao, nhưng UI overlay chỉ vẽ xe trong ROI)
      - AI_TRACK_OUTSIDE_ROI=1
      - SERVICE_INTERNAL_KEY=camerastream_secret_key_2026
      - AI_BENCH=0
      - OPENCV_FFMPEG_CAPTURE_OPTIONS=rtsp_transport;tcp|fflags;nobuffer|flags;low_delay|max_delay;0|framedrop;1
      - SNAPSHOT_STORAGE_PATH=/data/snapshots
    volumes:
      - ./ai_service:/app
      - ./data/snapshots:/data/snapshots
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mediamtx
      - backend

  backend:
    image: camerastream-backend:latest
    build:
      context: ./CameraStream
      dockerfile: Dockerfile
    container_name: camerastream-backend
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-camerastream_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - MEDIAMTX_API_URL=http://mediamtx:9997
      - MEDIAMTX_WEBRTC_URL=http://${HOST_IP:-localhost}:8889
      - MEDIAMTX_RTSP_URL=rtsp://${HOST_IP:-localhost}:8554
      - SNAPSHOT_STORAGE_PATH=/data/snapshots
      - SNAPSHOT_BASE_URL=http://${HOST_IP:-localhost}:8080/snapshots
      - BACKUP_STORAGE_PATH=/data/backup
      - SERVICE_INTERNAL_KEY=camerastream_secret_key_2026
    volumes:
      - ./data/snapshots:/data/snapshots
      - ./data/backup:/data/backup
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - mediamtx

  frontend:
    image: camerastream-frontend:latest
    build:
      context: ./CameraStream-FE
      dockerfile: Dockerfile
    container_name: camerastream-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./CameraStream-FE/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - ai-service

